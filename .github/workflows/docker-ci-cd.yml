name: Docker CI/CD

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker diagnostics
        run: |
          echo "Docker version:"
          docker version

          echo "Docker info:"
          docker info

          echo "Docker config directory:"
          ls -la ~/.docker || true

      - name: Check Docker secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USERNAME" ]; then
            echo "DOCKER_USERNAME is set"
          else
            echo "DOCKER_USERNAME is EMPTY"
            exit 1
          fi

          if [ -n "$DOCKER_PASSWORD" ]; then
            echo "DOCKER_PASSWORD is set"
          else
            echo "DOCKER_PASSWORD is EMPTY"
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t 362245/node-express-app:1.0 .

      - name: Push Docker image
        run: docker push 362245/node-express-app:1.0
